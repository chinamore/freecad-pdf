name: Build and Package Executable

# 触发条件设置
on:
  workflow_dispatch: # 添加该配置，支持在 GitHub 页面手动点击触发
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "PDFBubbleAnnotator" --icon assets/icon.ico --add-data "assets;assets" --hidden-import ezdwg --collect-all cadquery --collect-all OCP main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDFBubbleAnnotator-Windows-x64
        path: dist/PDFBubbleAnnotator/
